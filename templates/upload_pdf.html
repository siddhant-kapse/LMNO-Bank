<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with PDF</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 {
            margin: 20px;
            color: #333;
        }
        .container {
            width: 80%;
            max-width: 900px;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            margin-bottom: 30px;
        }
        #upload-section, #chat-section {
            margin-bottom: 20px;
        }
        #upload-section input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        #chatbox {
            width: 100%;
            height: 300px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            overflow-y: auto;
            background-color: #f9f9f9;
        }
        #chatbox p {
            margin: 5px 0;
        }
        input[type="text"], button {
            width: calc(100% - 24px);
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
            margin-top: 10px;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<h1>Chat with Your PDF Documents</h1>
<div class="container" id="upload-section">
    <h2>Upload PDF Files</h2>
    <p>Select PDF files you’d like to chat with. Click "Submit & Process" to upload and process them.</p>
    <form id="upload_form" enctype="multipart/form-data">
        <input type="file" name="pdf" id="file_input" multiple required>
        <button type="submit" id="submit_button">Submit & Process</button>
    </form>
</div>

<div class="container" id="chat-section">
    <h2>Ask Questions</h2>
    <div id="chatbox"></div>
    <input type="text" id="query_input" placeholder="Ask a question about the uploaded PDFs">
    <button onclick="sendQuery()">Send</button>
</div>

<script>
    // Handle file upload and PDF processing
    $(document).ready(function() {
        $('#upload_form').on('submit', function(e) {
            e.preventDefault();
            var formData = new FormData(this);
            $('#submit_button').prop('disabled', true).text('Processing...');
            $.ajax({
                url: '/data_extraction/upload_pdf',
                type: 'POST',
                data: formData,
                contentType: false,
                processData: false,
                success: function(data) {
                    alert(data.message);
                    $('#submit_button').prop('disabled', false).text('Submit & Process');
                },
                error: function() {
                    alert('Error processing PDF');
                    $('#submit_button').prop('disabled', false).text('Submit & Process');
                }
            });
        });
    });

    // Send a query to the backend
    function sendQuery() {
        var query = $('#query_input').val();
        if (!query) {
            alert("Please enter a query.");
            return;
        }

        $.ajax({
            url: '/data_extraction/ask_pdf',
            type: 'POST',
            contentType: 'application/json', // Set content type to JSON
            data: JSON.stringify({ query: query }), // Convert query to JSON string
            success: function(data) {
                if (data.error) {
                    alert(data.error);
                } else {
                    $('#chatbox').append("<p><strong>You:</strong> " + query + "</p>");
                    $('#chatbox').append("<p><strong>AI:</strong> " + data.answer + "</p>");
                    $('#query_input').val(''); // Clear input
                }
            },
            error: function(xhr, status, error) {
                alert('Error: ' + xhr.status + ' ' + error);
            }
        });
    }
</script>

</body>
</html>
